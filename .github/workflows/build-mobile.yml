name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - '.github/workflows/build-mobile.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: '打包平台 (Target Platform)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      build_type:
        description: 'Android 构建类型 (Build Type)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      publish_release:
        description: '发布到 GitHub Releases (Publish to Release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile=false

      - name: Build Web App
        working-directory: app
        run: pnpm run build

      - name: Sync Capacitor Android
        working-directory: app
        run: npx cap sync android

      - name: Build Android Debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Android Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename Android Package
        run: |
          VERSION=$(node "$GITHUB_WORKSPACE/scripts/bump-version.js" --get)
          find app/android/app/build/outputs/apk -type f -name "*.apk" | while read -r apk_file; do
            dir=$(dirname "$apk_file")
            mv "$apk_file" "$dir/Byerun_${VERSION}_universal.apk"
          done

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Byerun-Android-APK
          path: app/android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ios'
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile=false

      - name: Build Web App
        working-directory: app
        run: pnpm run build

      - name: Sync Capacitor iOS
        working-directory: app
        run: npx cap sync ios

      - name: Build Xcode Project (Unsigned)
        working-directory: app/ios/App
        run: |
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        working-directory: app/ios/App
        run: |
          VERSION=$(node "$GITHUB_WORKSPACE/scripts/bump-version.js" --get)
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r "Byerun_${VERSION}_arm64.ipa" Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Byerun-iOS-IPA
          path: app/ios/App/Byerun_*.ipa
          retention-days: 14

  update-version:
    name: Bump Version on Build Success
    needs: [build-android, build-ios]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump Version & Record Beijing Time
        id: bump
        run: |
          NEW_VER=$(node scripts/bump-version.js --bump)
          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT

      - name: Commit and Push Version Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json app/public/version.json app/src/version.json app/package.json
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Version
        id: ver
        run: |
          CURR_VER=$(node scripts/bump-version.js --get)
          echo "version=$CURR_VER" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}"
          name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Byerun Mobile v{0}', steps.ver.outputs.version) }}"
          files: |
            Byerun-Android-APK/**/*.apk
            Byerun-iOS-IPA/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
